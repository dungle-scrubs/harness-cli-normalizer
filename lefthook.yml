pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: node_modules/.bin/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: types
      glob: "*.{ts,tsx,json}"
      run: node_modules/.bin/tsc --noEmit

pre-push:
  jobs:
    # Catch secrets before they reach the remote, not after. Scanning after a
    # push is too late to be useful, so this stays a local hook - there is no
    # TruffleHog GitHub Actions workflow by design.
    - name: trufflehog
      run: >-
        trufflehog git file://. --only-verified --fail --no-update
