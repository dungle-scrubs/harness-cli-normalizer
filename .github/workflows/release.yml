name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Manifest-driven: reads release-please-config.json +
          # .release-please-manifest.json. The package is source-public only,
          # so no publish command is wired.
          command: manifest
