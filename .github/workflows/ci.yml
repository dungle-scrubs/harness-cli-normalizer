name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    uses: ./.github/workflows/native-snapshot.yml
    with:
      ref: ${{ github.sha }}
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile
      - run: bash .github/prepare-transcript-test-filesystem.sh

      # Mirrors `pnpm check` explicitly so each failed gate is named in Actions.
      # The build runs before the tests: dist/ is git-ignored, and the CLI
      # stub tests fail (never skip) when it is missing or older than src/.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:bun
      - run: pnpm check:package

      # publish.yml publishes with npm@latest, which can differ from the
      # runner's npm (npm 12 changed the `npm pack --json` shape). Run the
      # package check under it here, last, so a break shows on the pull
      # request instead of at release time.
      - name: Package check under the npm that publishes
        run: |
          npm install --global npm@latest
          pnpm check:package

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, native]
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Manifest-driven: reads release-please-config.json and
      # .release-please-manifest.json.
      - id: release
        uses: googleapis/release-please-action@v5

      # GITHUB_TOKEN-created pull requests do not start ordinary CI without
      # approval. workflow_dispatch is the supported recursive-run exception,
      # so the generated release branch receives the same required check.
      - name: Check the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"

      # Release Please publishes with GITHUB_TOKEN, so the resulting release
      # event cannot start another workflow. workflow_dispatch is the supported
      # recursive-run exception.
      - name: Publish the release to npm
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: >-
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
          --field tag="$RELEASE_TAG"
