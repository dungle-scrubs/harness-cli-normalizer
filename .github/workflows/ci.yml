name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      # Mirrors `pnpm check` explicitly so each failed gate is named in Actions.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:bun
      - run: pnpm build
      - run: pnpm check:package

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Manifest-driven: reads release-please-config.json and
      # .release-please-manifest.json. A published GitHub release triggers
      # the separate npm trusted-publishing workflow.
      - id: release
        uses: googleapis/release-please-action@v5

      # GITHUB_TOKEN-created pull requests do not start ordinary CI without
      # approval. workflow_dispatch is the supported recursive-run exception,
      # so the generated release branch receives the same required check.
      - name: Check the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"
