name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      # Mirrors `pnpm check`: lint, typecheck, vitest, then the bun test lane.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:bun

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Manifest-driven: reads release-please-config.json and
      # .release-please-manifest.json. The package is source-public only,
      # so no publish command is wired.
      - uses: googleapis/release-please-action@v5
